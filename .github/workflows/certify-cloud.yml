name: Certify cloud

# Dormant credentialed workflow (Workstream 6).
# Jobs skip when GRANE_CERT_* secrets are absent.
# continue-on-error is false on the certify step. That step runs only when
# the engine's secrets are present, so a skip is a successful no-op — not a
# swallowed failure. See docs/certify.md.
#
# P0-1: GRANE_CERT_BIGQUERY_CREDENTIALS is a file path (keyFilename), not
# the JSON body. Passing the Actions secret value through as that env var
# is the failure this blocks: a BigQuery cert run that silently fails to authenticate.
# The workflow writes the secret JSON to a mktemp file at 0600 under RUNNER_TEMP
# (outside the repo and workspace artifacts), exports that path, and deletes
# the file on every exit path (trap EXIT plus an always() step). Never echo,
# log, or upload the key. Forked-PR workflows do not receive the secret.
#
# Snowflake P0-2: password-only sign-in is being phased out. A user with no
# TYPE counts as human and needs MFA, so an automated certify run will fail.
# Prefer GRANE_CERT_SNOWFLAKE_PRIVATE_KEY (PEM). The workflow writes it with
# mktemp at 0600 under RUNNER_TEMP (outside the repo and workspace artifacts),
# exports the path, and deletes the file on every exit (trap EXIT plus
# always()). Never echo, log, or upload the key. Forked-PR workflows do not
# receive the secret.

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Warehouse to certify
        type: choice
        options:
          - all
          - snowflake
          - bigquery
          - databricks
          - redshift
        default: all
  schedule:
    # Optional weekly. No-ops without secrets.
    - cron: "0 6 * * 1"
  pull_request:
    types: [labeled, opened, synchronize, reopened]

jobs:
  certify:
    name: certify-${{ matrix.engine }}
    if: >
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'schedule'
      || (github.event_name == 'pull_request'
          && contains(join(github.event.pull_request.labels.*.name, ','), 'certify-cloud'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [snowflake, bigquery, databricks, redshift]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Select engine
        id: select
        env:
          REQUESTED: ${{ github.event.inputs.engine || 'all' }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$REQUESTED" != "all" ] && [ "$REQUESTED" != "${{ matrix.engine }}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect ${{ matrix.engine }} secrets
        if: steps.select.outputs.run == 'true'
        id: creds
        env:
          GRANE_CERT_SNOWFLAKE_ACCOUNT: ${{ secrets.GRANE_CERT_SNOWFLAKE_ACCOUNT }}
          GRANE_CERT_SNOWFLAKE_USER: ${{ secrets.GRANE_CERT_SNOWFLAKE_USER }}
          GRANE_CERT_SNOWFLAKE_PASSWORD: ${{ secrets.GRANE_CERT_SNOWFLAKE_PASSWORD }}
          GRANE_CERT_SNOWFLAKE_WAREHOUSE: ${{ secrets.GRANE_CERT_SNOWFLAKE_WAREHOUSE }}
          GRANE_CERT_SNOWFLAKE_DATABASE: ${{ secrets.GRANE_CERT_SNOWFLAKE_DATABASE }}
          GRANE_CERT_SNOWFLAKE_HAS_KEY: ${{ secrets.GRANE_CERT_SNOWFLAKE_PRIVATE_KEY != '' }}
          GRANE_CERT_BIGQUERY_PROJECT: ${{ secrets.GRANE_CERT_BIGQUERY_PROJECT }}
          GRANE_CERT_DATABRICKS_HOST: ${{ secrets.GRANE_CERT_DATABRICKS_HOST }}
          GRANE_CERT_DATABRICKS_HTTP_PATH: ${{ secrets.GRANE_CERT_DATABRICKS_HTTP_PATH }}
          GRANE_CERT_DATABRICKS_TOKEN: ${{ secrets.GRANE_CERT_DATABRICKS_TOKEN }}
          GRANE_CERT_REDSHIFT_URL: ${{ secrets.GRANE_CERT_REDSHIFT_URL }}
        run: |
          present=false
          fork=false
          # `pull_request` from a fork has an empty secrets context. Force
          # present=false so a later pull_request_target change cannot
          # materialize the BigQuery key or Snowflake private key for an untrusted workflow.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            head_repo="${{ github.event.pull_request.head.repo.full_name }}"
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] || [ "$head_repo" != "${{ github.repository }}" ]; then
              fork=true
              echo "present=false" >> "$GITHUB_OUTPUT"
              echo "fork=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          case "${{ matrix.engine }}" in
            snowflake)
              if [ -n "$GRANE_CERT_SNOWFLAKE_ACCOUNT" ] && [ -n "$GRANE_CERT_SNOWFLAKE_USER" ] && [ -n "$GRANE_CERT_SNOWFLAKE_WAREHOUSE" ] && [ -n "$GRANE_CERT_SNOWFLAKE_DATABASE" ] && { [ -n "$GRANE_CERT_SNOWFLAKE_PASSWORD" ] || [ "$GRANE_CERT_SNOWFLAKE_HAS_KEY" = "true" ]; }; then
                present=true
              fi
              ;;
            bigquery)
              if [ -n "$GRANE_CERT_BIGQUERY_PROJECT" ]; then
                present=true
              fi
              ;;
            databricks)
              if [ -n "$GRANE_CERT_DATABRICKS_HOST" ] && [ -n "$GRANE_CERT_DATABRICKS_HTTP_PATH" ] && [ -n "$GRANE_CERT_DATABRICKS_TOKEN" ]; then
                present=true
              fi
              ;;
            redshift)
              if [ -n "$GRANE_CERT_REDSHIFT_URL" ]; then
                present=true
              fi
              ;;
          esac
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "fork=$fork" >> "$GITHUB_OUTPUT"
      - name: Skip (secrets absent or engine not selected)
        if: steps.select.outputs.run != 'true' || steps.creds.outputs.present != 'true'
        run: |
          if [ "${{ steps.select.outputs.run }}" != "true" ]; then
            echo "Skipping ${{ matrix.engine }} (workflow_dispatch selected a different engine)."
          elif [ "${{ steps.creds.outputs.fork }}" = "true" ]; then
            echo "Skipping ${{ matrix.engine }} — forked PR; GRANE_CERT_* secrets are not available."
          else
            echo "Skipping ${{ matrix.engine }} — GRANE_CERT_* secrets absent. Expected on public PRs. See docs/certify.md."
          fi
      - name: Certify ${{ matrix.engine }}
        if: steps.select.outputs.run == 'true' && steps.creds.outputs.present == 'true'
        continue-on-error: false
        env:
          GRANE_CERT_SNOWFLAKE_ACCOUNT: ${{ secrets.GRANE_CERT_SNOWFLAKE_ACCOUNT }}
          GRANE_CERT_SNOWFLAKE_USER: ${{ secrets.GRANE_CERT_SNOWFLAKE_USER }}
          GRANE_CERT_SNOWFLAKE_PASSWORD: ${{ secrets.GRANE_CERT_SNOWFLAKE_PASSWORD }}
          GRANE_CERT_SNOWFLAKE_WAREHOUSE: ${{ secrets.GRANE_CERT_SNOWFLAKE_WAREHOUSE }}
          GRANE_CERT_SNOWFLAKE_DATABASE: ${{ secrets.GRANE_CERT_SNOWFLAKE_DATABASE }}
          GRANE_CERT_SNOWFLAKE_ROLE: ${{ secrets.GRANE_CERT_SNOWFLAKE_ROLE }}
          GRANE_CERT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.GRANE_CERT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          # Secret is the PEM document. Never assign it to
          # GRANE_CERT_SNOWFLAKE_PRIVATE_KEY until it is a 0600 temp-file path.
          # Empty on forked PRs even if this step's if: were bypassed.
          GRANE_CERT_SNOWFLAKE_PRIVATE_KEY_PEM: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.GRANE_CERT_SNOWFLAKE_PRIVATE_KEY || '' }}
          GRANE_CERT_BIGQUERY_PROJECT: ${{ secrets.GRANE_CERT_BIGQUERY_PROJECT }}
          GRANE_CERT_BIGQUERY_LOCATION: ${{ secrets.GRANE_CERT_BIGQUERY_LOCATION }}
          # Secret is the JSON document. Never assign it to
          # GRANE_CERT_BIGQUERY_CREDENTIALS (that env var is a file path).
          # Empty on forked PRs even if this step's if: were bypassed.
          GRANE_CERT_BIGQUERY_JSON: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.GRANE_CERT_BIGQUERY_CREDENTIALS || '' }}
          GRANE_CERT_DATABRICKS_HOST: ${{ secrets.GRANE_CERT_DATABRICKS_HOST }}
          GRANE_CERT_DATABRICKS_HTTP_PATH: ${{ secrets.GRANE_CERT_DATABRICKS_HTTP_PATH }}
          GRANE_CERT_DATABRICKS_TOKEN: ${{ secrets.GRANE_CERT_DATABRICKS_TOKEN }}
          GRANE_CERT_DATABRICKS_CATALOG: ${{ secrets.GRANE_CERT_DATABRICKS_CATALOG }}
          GRANE_CERT_REDSHIFT_URL: ${{ secrets.GRANE_CERT_REDSHIFT_URL }}
        run: |
          set +x
          set +o xtrace
          cleanup_bq_key() {
            if [ -n "${GRANE_BQ_KEY_FILE:-}" ]; then
              rm -f -- "$GRANE_BQ_KEY_FILE"
            fi
          }
          cleanup_sf_key() {
            if [ -n "${GRANE_SF_KEY_FILE:-}" ]; then
              rm -f -- "$GRANE_SF_KEY_FILE"
            fi
          }
          cleanup_cert_keys() {
            cleanup_sf_key
            cleanup_bq_key
          }
          trap cleanup_cert_keys EXIT
          if [ "${{ matrix.engine }}" = "snowflake" ] && [ -n "${GRANE_CERT_SNOWFLAKE_PRIVATE_KEY_PEM:-}" ]; then
            GRANE_SF_KEY_FILE="$(mktemp -p "${RUNNER_TEMP:-/tmp}" grane-sf-XXXXXX)"
            chmod 0600 "$GRANE_SF_KEY_FILE"
            printf '%s' "$GRANE_CERT_SNOWFLAKE_PRIVATE_KEY_PEM" > "$GRANE_SF_KEY_FILE"
            unset GRANE_CERT_SNOWFLAKE_PRIVATE_KEY_PEM
            export GRANE_CERT_SNOWFLAKE_PRIVATE_KEY="$GRANE_SF_KEY_FILE"
            printf 'GRANE_SF_KEY_FILE=%s\n' "$GRANE_SF_KEY_FILE" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.engine }}" = "bigquery" ] && [ -n "${GRANE_CERT_BIGQUERY_JSON:-}" ]; then
            GRANE_BQ_KEY_FILE="$(mktemp -p "${RUNNER_TEMP:-/tmp}" grane-bq-XXXXXX)"
            chmod 0600 "$GRANE_BQ_KEY_FILE"
            printf '%s' "$GRANE_CERT_BIGQUERY_JSON" > "$GRANE_BQ_KEY_FILE"
            unset GRANE_CERT_BIGQUERY_JSON
            export GRANE_CERT_BIGQUERY_CREDENTIALS="$GRANE_BQ_KEY_FILE"
            # Path only — never the JSON — so the always() step can delete it.
            printf 'GRANE_BQ_KEY_FILE=%s\n' "$GRANE_BQ_KEY_FILE" >> "$GITHUB_ENV"
          fi
          npx tsx src/cli/index.ts certify --engine ${{ matrix.engine }}
      - name: Remove Snowflake and BigQuery key files
        if: always()
        run: |
          set +x
          if [ -n "${GRANE_SF_KEY_FILE:-}" ]; then
            rm -f -- "$GRANE_SF_KEY_FILE"
          fi
          if [ -n "${GRANE_BQ_KEY_FILE:-}" ]; then
            rm -f -- "$GRANE_BQ_KEY_FILE"
          fi
      - name: Upload certification report
        if: always() && steps.select.outputs.run == 'true' && steps.creds.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: certify-${{ matrix.engine }}
          path: certification/${{ matrix.engine }}.json
          if-no-files-found: ignore
