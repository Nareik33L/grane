name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grane
          POSTGRES_PASSWORD: grane
          POSTGRES_DB: grane_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grane -d grane_demo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        # Pin 8.x: COUNT(*) OVER needs MySQL 8.0+. mysql2 handles the
        # default caching_sha2_password auth plugin — do not force
        # mysql_native_password. MYSQL_ROOT_HOST=% so the job container
        # can connect as root (CREATE DATABASE / CREATE USER).
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: grane
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: grane_demo
          MYSQL_USER: grane
          MYSQL_PASSWORD: grane
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pgrane --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      clickhouse:
        # Pin 24.x LTS. Every Grane query sets readonly=1, join_use_nulls=1
        # (unmatched LEFT JOIN is NULL, not 0/''), session_timezone=UTC,
        # aggregate_functions_null_for_empty, and max_execution_time.
        # wget not curl: the image has no curl, so /ping health must use wget.
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_DB: default
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: grane
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
        options: >-
          --ulimit nofile=262144:262144
          --health-cmd "wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      GRANE_PG_WRITE_URL: postgres://grane:grane@localhost:5432/grane_demo
      GRANE_PG_READ_URL: postgres://grane_readonly:grane_readonly@localhost:5432/grane_demo
      GRANE_MYSQL_WRITE_URL: mysql://root:grane@127.0.0.1:3306/grane_demo
      GRANE_MYSQL_READ_URL: mysql://grane_readonly:grane_readonly@127.0.0.1:3306/grane_demo
      GRANE_CLICKHOUSE_URL: http://default:grane@127.0.0.1:8123
      # Fail the corpus if a CI-certified engine is unreachable (no silent skip).
      GRANE_CERT_REQUIRE: postgres,duckdb,mysql,clickhouse
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Show PostgreSQL version
        run: node --input-type=module -e "import pg from 'pg'; const c=new pg.Client({connectionString:process.env.GRANE_PG_WRITE_URL}); await c.connect(); console.log((await c.query('select version()')).rows[0].version); await c.end();"
      - name: Load MySQL timezone tables
        run: |
          set -euo pipefail
          # Official mysql image does not populate mysql.time_zone* tables.
          # CONVERT_TZ(..., 'UTC', 'America/New_York') returns NULL until loaded.
          cid=$(docker ps --filter ancestor=mysql:8.4 --format '{{.ID}}' | head -n1)
          docker exec "$cid" bash -c "mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -uroot -pgrane mysql"
      - name: Show MySQL version and CONVERT_TZ
        run: |
          node --input-type=module -e "
            import mysql from 'mysql2/promise';
            const c = await mysql.createConnection(process.env.GRANE_MYSQL_WRITE_URL);
            const [v] = await c.query('SELECT VERSION() AS version');
            const [t] = await c.query(\"SELECT CONVERT_TZ('2026-08-01 04:00:00', 'UTC', 'America/New_York') AS t\");
            console.log(v[0].version, t[0].t);
            if (t[0].t == null) { console.error('CONVERT_TZ returned NULL — timezone tables missing'); process.exit(1); }
            await c.end();
          "
      - name: Show ClickHouse version
        run: |
          node --input-type=module -e "
            import { createClient } from '@clickhouse/client';
            const c = createClient({ url: process.env.GRANE_CLICKHOUSE_URL });
            const r = await c.query({ query: 'SELECT version() AS version', format: 'JSON' });
            const j = await r.json();
            console.log(j.data[0].version);
            await c.close();
          "
      - run: npm run test:unit
      - name: Upload certification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certification-reports
          path: certification/*.json
          if-no-files-found: ignore
      # The A/B/C thesis benchmark. DuckDB is a devDependency, so this runs
      # without making it a default runtime install.
      - run: npm run test:benchmark
      # Internal robustness gauntlet. Fails when the harness is broken or a
      # known defect-class mutation is not detected. See tests/gauntlet/README.md.
      - run: npm run test:gauntlet
      - run: npm run build
