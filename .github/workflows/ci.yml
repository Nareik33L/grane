name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      # The A/B/C thesis benchmark. DuckDB is a devDependency, so this runs
      # without making it a default runtime install.
      - run: npm run test:benchmark
      - run: npm run build
