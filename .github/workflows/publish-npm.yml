name: Publish npm

# Tag-driven publish. This PR does not create the `npm-publish` environment,
# add NPM_TOKEN, or change repo settings. Until a human creates that
# protected environment (manual approval) and sets the token, a tag or
# dispatch cannot publish: missing token fails closed.
#
# Do not add repository secrets here. Do not run this workflow from this PR.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - name: npm pack --dry-run file-list check
        run: npx tsx src/release/check-pack.ts
      - name: Fail closed if NPM_TOKEN is missing
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is not set on the npm-publish environment. Fail closed; not publishing."
            exit 1
          fi
      - name: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
