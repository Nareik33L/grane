services:
  postgres:
    image: postgres:16
    container_name: grane-example-db
    environment:
      POSTGRES_USER: grane
      POSTGRES_PASSWORD: grane
      POSTGRES_DB: grane_demo
    ports:
      - "5433:5432"
    volumes:
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grane -d grane_demo"]
      interval: 2s
      timeout: 5s
      retries: 30
