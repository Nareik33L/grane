# Postgres-only demo warehouse for integration tests and local CLI use.
# Full stack (Postgres + Grane MCP): docker compose up  (repo root)

services:
  postgres:
    image: postgres:16
    container_name: grane-example-db
    environment:
      POSTGRES_USER: grane
      POSTGRES_PASSWORD: grane
      POSTGRES_DB: grane_demo
    ports:
      - "5433:5432"
    volumes:
      - ../demo/seed/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../demo/seed/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grane -d grane_demo"]
      interval: 2s
      timeout: 5s
      retries: 30
