# Grane project that does not redefine metrics. Auto-detects dbt/MetricFlow
# under ../dbt-shop and reads the example DuckDB warehouse.

project:
  name: grane-from-dbt
  timezone: UTC

connection:
  type: duckdb
  path: ../analytics-duckdb/warehouse.duckdb
  schema: main

exploration:
  enabled: true
  schemas:
    - main
  exclude:
    - customers.email

providers:
  - path: ../dbt-shop
