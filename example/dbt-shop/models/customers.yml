# dbt 1.12+ model-embedded semantic spec. Grane accepts this alongside
# legacy semantic_models: YAML in the same project.

models:
  - name: customers
    description: Registered customers.
    semantic_model:
      enabled: true
    agg_time_dimension: created_at
    columns:
      - name: id
        entity:
          type: primary
          name: customer
      - name: country
        dimension:
          type: categorical
      - name: customer_type
        dimension:
          type: categorical
      - name: created_at
        granularity: day
        dimension:
          type: time
    metrics:
      - name: customers
        description: Number of registered customers.
        type: simple
        agg: count
        expr: id
