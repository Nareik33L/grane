project:
  name: grane-demo
  timezone: UTC
  week:
    starts: monday

connection:
  type: postgres
  url: ${DATABASE_URL:-postgres://grane_readonly:grane_readonly@localhost:5433/grane_demo}
  schema: public

limits:
  max_rows: 10000
  default_rows: 1000
  timeout_ms: 30000

exploration:
  enabled: true
  schemas:
    - public
  exclude:
    - customers.email

entities:
  customer:
    table: customers
    primary_key: id
    description: A registered shop account. Not "someone who has ordered".
  order:
    table: orders
    primary_key: id
    description: A customer order. Revenue and most metrics live at this grain.
  product:
    table: products
    primary_key: id
    description: A sellable product.
