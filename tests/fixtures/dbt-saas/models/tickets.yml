version: 2

models:
  - name: fct_tickets
    semantic_model:
      enabled: true
      name: tickets
    agg_time_dimension: opened_at
    columns:
      - name: ticket_id
        entity:
          type: primary
          name: ticket
      - name: customer_id
        entity:
          type: foreign
          name: customer
      - name: opened_at
        granularity: day
        dimension:
          type: time
          name: opened_at
      - name: category
        dimension:
          type: categorical
          name: ticket_category
    metrics:
      - name: support_tickets
        type: simple
        agg: count
        expr: 1
