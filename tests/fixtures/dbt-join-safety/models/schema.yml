version: 2

semantic_models:
  - name: orders
    model: ref('fct_orders')
    defaults:
      agg_time_dimension: ordered_at
    entities:
      - name: order
        type: primary
        expr: order_id
      - name: customer
        type: foreign
        expr: customer_id
      - name: product
        type: foreign
        expr: product_id
    dimensions:
      - name: ordered_at
        type: time
        expr: ordered_at
        type_params:
          time_granularity: day
      - name: customer_segment
        type: categorical
        expr: order_segment
      - name: channel
        type: categorical
        expr: channel
    measures:
      - name: revenue
        agg: sum
        expr: amount
        create_metric: true
      - name: order_count
        agg: count
        expr: 1
        create_metric: true
      - name: distinct_customers
        agg: count_distinct
        expr: customer_id
        create_metric: true
  - name: customers
    model: ref('dim_customers')
    entities:
      - name: customer
        type: primary
        expr: customer_id
      - name: manager
        type: foreign
        expr: manager_id
    dimensions:
      - name: account
        type: categorical
        expr: account
      - name: customer_segment
        type: categorical
        expr: segment
  - name: managers
    model: ref('dim_managers')
    entities:
      - name: manager
        type: primary
        expr: manager_id
    dimensions:
      - name: manager_name
        type: categorical
        expr: manager_name
  - name: orders_mirror
    model: ref('fct_orders')
    entities:
      - name: order_row
        type: primary
        expr: order_id
    dimensions:
      - name: channel
        type: categorical
        expr: channel
  - name: products
    model: ref('dim_products')
    entities:
      - name: product
        type: primary
        expr: product_id
    dimensions:
      - name: category
        type: categorical
        expr: category
  - name: tags
    model: ref('dim_tags')
    entities:
      - name: tag_row
        type: primary
        expr: tag_row_id
      - name: customer
        type: unique
        expr: customer_id
    dimensions:
      - name: tag
        type: categorical
        expr: tag
  - name: regions
    model: ref('dim_regions')
    entities:
      - name: customer
        type: primary
        expr: customer_id
    dimensions:
      - name: region
        type: categorical
        expr: region
  - name: mrr_snapshot
    model: ref('fct_mrr_snapshot')
    defaults:
      agg_time_dimension: month_start
    entities:
      - name: customer_month
        type: primary
        expr: customer_month_id
      - name: customer
        type: foreign
        expr: customer_id
    dimensions:
      - name: month_start
        type: time
        expr: month_start
        type_params:
          time_granularity: month
      - name: customer_segment
        type: categorical
        expr: snapshot_segment
    measures:
      - name: ending_mrr
        agg: sum
        expr: mrr
        create_metric: true
        non_additive_dimension:
          name: month_start
          window_choice: max
      - name: ending_mrr_by_customer
        agg: sum
        expr: mrr
        create_metric: true
        non_additive_dimension:
          name: month_start
          window_choice: max
          window_groupings:
            - customer

metrics:
  - name: revenue_per_order
    type: ratio
    type_params:
      numerator: revenue
      denominator: order_count
  - name: enterprise_revenue
    type: simple
    type_params:
      measure:
        name: revenue
        filter: "{{ Dimension('order__customer_segment') }} = 'Enterprise'"
  - name: cross_model_enterprise_revenue
    type: simple
    type_params:
      measure:
        name: revenue
        filter: "{{ Dimension('customer__customer_segment') }} = 'SMB'"
