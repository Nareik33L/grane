semantic_model:
  - name: shop
    datasets:
      - name: orders
        source: public.orders
        primary_key: [id]
        fields:
          - name: id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: id
          - name: status
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: status
            dimension:
              is_time: false
          - name: completed_at
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: completed_at
            dimension:
              is_time: true
          - name: net_amount
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: net_amount
          - name: customer_id
            expression:
              dialects:
                - dialect: ANSI_SQL
                  expression: customer_id
      - name: customers
        source: public.customers
        primary_key: [id]
        fields:
          - name: id
            expression: id
          - name: country
            expression: country
            dimension: {}
    relationships:
      - name: orders_to_customers
        from: orders
        to: customers
        from_columns: [customer_id]
        to_columns: [id]
    metrics:
      - name: revenue
        description: Completed order value
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.net_amount)
        ai_context:
          synonyms:
            - sales
      - name: customer_lifetime_value
        expression:
          dialects:
            - dialect: ANSI_SQL
              expression: SUM(orders.net_amount) / COUNT(DISTINCT customers.id)
