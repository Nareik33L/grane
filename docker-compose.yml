# Self-contained Grane demo: shop warehouse + MCP server.
#
#   git clone https://github.com/Nareik33L/grane.git
#   cd grane
#   docker compose up
#
# Then ask an MCP agent: "Why did Revenue fall last month?"
# MCP: http://localhost:8080/mcp
# Postgres: localhost:5433 (user grane_readonly / grane_readonly, db grane_demo)
#
# Production (your own database): docker compose -f docker-compose.prod.yml up

services:
  postgres:
    image: postgres:16
    container_name: grane-demo-db
    environment:
      POSTGRES_USER: grane
      POSTGRES_PASSWORD: grane
      POSTGRES_DB: grane_demo
    ports:
      - "5433:5432"
    volumes:
      - ./demo/seed/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./demo/seed/02_data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grane -d grane_demo"]
      interval: 2s
      timeout: 5s
      retries: 30

  grane:
    build: .
    image: ghcr.io/nareik33l/grane:0.6.5
    container_name: grane-demo
    environment:
      DATABASE_URL: postgres://grane_readonly:grane_readonly@postgres:5432/grane_demo
      GRANE_AUDIT_PATH: /var/log/grane/audit.jsonl
    volumes:
      - ./demo/analytics:/project:ro
      - grane-demo-audit:/var/log/grane
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  grane-demo-audit:
